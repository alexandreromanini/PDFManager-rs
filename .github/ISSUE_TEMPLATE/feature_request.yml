name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe what you are trying to do and why it is difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, or how another PDF tool does it.
