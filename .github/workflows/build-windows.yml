name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]  # vX.Y.Z : publie aussi une Release (lien de téléchargement direct)
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # création des Releases

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2  # MuPDF compile en plusieurs minutes : mis en cache

      - name: Tests
        run: cargo test --release

      - name: Exe
        run: cargo build --release

      - name: Autotest de l'exe (chemin accentue)
        run: |
          $p = Start-Process target\release\pdfmanager.exe -ArgumentList '--selftest', "`"tests\fixtures\Été déjà vu.pdf`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Autotest en echec (code $($p.ExitCode))" }
          "Taille de l'exe : {0:N1} Mo" -f ((Get-Item target\release\pdfmanager.exe).Length / 1MB)

      - name: Bibliothèques C++ de Windows (déploiement local)
        run: |
          # llama.cpp (C++) dépend de msvcp140.dll, absente de certains Windows récents.
          New-Item -ItemType Directory -Force dist\crt | Out-Null
          foreach ($d in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot\System32\$d" dist\crt\ -ErrorAction Stop
          }
          Get-ChildItem dist\crt | ForEach-Object { "{0} {1:N0} Ko" -f $_.Name, ($_.Length / 1KB) }

      - name: Installeur (Inno Setup)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup en echec" }
          "Installeur : {0:N1} Mo" -f ((Get-Item "dist\PDFManager-rs-$v-setup.exe").Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: PDFManager-rs-setup
          path: dist/PDFManager-rs-*-setup.exe
          if-no-files-found: error

      - name: Publier la Release (tag vX.Y.Z, notes tirees du CHANGELOG)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $notes = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)").Groups[1].Value.Trim()
          Set-Content notes.md $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "dist\PDFManager-rs-$v-setup.exe" --title "PDFManager (Rust) $v" --notes-file notes.md
