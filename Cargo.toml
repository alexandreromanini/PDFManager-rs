[package]
name = "pdfmanager"
version = "0.9.0"
edition = "2024"
description = "Lecteur et éditeur PDF personnel (réécriture en Rust de PDFManager)"
license = "AGPL-3.0-or-later"

[dependencies]
flate2 = "1"
crc32fast = "1"
arboard = "3.7.0"
chrono = "0.4.45"
cms = "0.2"
der = "0.7"
dirs = "7.0.0"
ecdsa = "0.16"
interprocess = "2.4.6"
jpeg-encoder = "0.7.1"
llama-cpp-2 = { version = "0.1.160", default-features = false }
mupdf = "0.8"
open = "5.4.4"
oxifont-subset = "0.2"
p12-keystore = "0.1"
p256 = "0.13"
p384 = "0.13"
pkcs8 = "0.10"
png = "0.18.1"
rfd = "0.17.2"
rsa = "0.9"
rustls-native-certs = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"
similar = "2"
slint = { version = "1.18", features = ["unstable-winit-030"] }
ttf-parser = "0.25.1"
ureq = "3"
x509-cert = "0.2"
x509-tsp = "0.1"

[features]
# Développement : captures d'écran hors écran (pdfmanager --capture …), absent de l'exe livré.
capture = []

[build-dependencies]
slint-build = "1.18"
winresource = "0.1.34"

[profile.release]
strip = true       # symboles de débogage retirés : exe plus léger
# Pas de LTO : la CI lie l'exécutable deux fois (tests, puis exe), ~2 min gagnées pour
# quelques Mo de plus.

# MuPDF (bibliothèque Rust) avec un correctif : voir vendor/mupdf/CORRECTIF.md.
[patch.crates-io]
mupdf = { path = "vendor/mupdf" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs"] }
